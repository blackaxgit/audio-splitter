{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "audio-splitter.fullname" . }}
  labels:
    {{- include "audio-splitter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "audio-splitter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
{{- end }}
